<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>InnovestX Auto Trader V1</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f6f7f9;color:#1f2937}.wrap{max-width:980px;margin:40px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.04)}h1{margin-bottom:8px}small,.muted{color:#6b7280}input,select,button{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border-radius:10px;border:1px solid #d1d5db}button{cursor:pointer;font-weight:700}.danger{background:#991b1b;color:white;border:none}.go{background:#111827;color:white;border:none}.ok{color:#047857;font-weight:700}.bad{color:#b91c1c;font-weight:700}pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#e5e7eb;padding:12px;border-radius:10px;min-height:80px}</style>
</head>
<body><div class="wrap">
<h1>InnovestX Auto Trader V1</h1><p class="muted">เริ่มต้นในโหมด Simulator ก่อน แล้วค่อยเชื่อม Settrade Sandbox หลังตรวจสอบ adapter</p>
<div class="grid">
<div class="card"><h3>System</h3><div id="status">Loading…</div><button class="danger" onclick="stopBot(true)">EMERGENCY STOP</button><button onclick="stopBot(false)">Resume</button></div>
<div class="card"><h3>ส่งคำสั่งทดสอบ</h3><input id="symbol" value="PTT" placeholder="Symbol"><select id="side"><option>BUY</option><option>SELL</option></select><input id="volume" type="number" value="100"><input id="price" type="number" step="0.01" value="30"><button class="go" onclick="placeOrder()">Submit test order</button><pre id="result"></pre></div>
<div class="card"><h3>Portfolio</h3><pre id="portfolio"></pre><button onclick="loadPortfolio()">Refresh</button></div>
<div class="card"><h3>Orders</h3><pre id="orders"></pre><button onclick="loadOrders()">Refresh</button></div>
</div></div>
<script>
async function j(url,opts){const r=await fetch(url,opts);const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw new Error(typeof d==='object'?(d.detail||JSON.stringify(d)):d);return d}
async function loadStatus(){try{const d=await j('/api/status');document.getElementById('status').innerHTML=`<div>Mode: <b>${d.mode}</b></div><div>Adapter: ${d.adapter.adapter}</div><div>Connected: ${d.adapter.connected?'<span class="ok">YES</span>':'<span class="bad">NO</span>'}</div><div>Emergency stop: <b>${d.risk.emergency_stop}</b></div><div>Live orders unlocked: <b>${d.allow_live_orders}</b></div>`}catch(e){document.getElementById('status').textContent=e.message}}
async function loadPortfolio(){try{document.getElementById('portfolio').textContent=JSON.stringify(await j('/api/portfolio'),null,2)}catch(e){document.getElementById('portfolio').textContent=e.message}}
async function loadOrders(){try{document.getElementById('orders').textContent=JSON.stringify(await j('/api/orders'),null,2)}catch(e){document.getElementById('orders').textContent=e.message}}
async function placeOrder(){const body={symbol:symbol.value.toUpperCase(),side:side.value,volume:+volume.value,price:+price.value,price_type:'LIMIT'};try{result.textContent=JSON.stringify(await j('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),null,2);await loadPortfolio();await loadOrders()}catch(e){result.textContent=e.message}}
async function stopBot(v){await j('/api/emergency-stop/'+v,{method:'POST'});await loadStatus()}
loadStatus();loadPortfolio();loadOrders();
</script></body></html>
